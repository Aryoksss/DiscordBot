server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
  server:
    password: "${LAVALINK_PASS}"
    sources:
      youtube: false # Using plugin instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters: # Enabling all filters
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    ratelimit:
      # ipBlocks: ["2400:6180:0:d2::/64"]
      # strategy: "RotateOnBan"
      # searchTriggersFail: true
      # retryLimit: -1
      httpProxy: "${LAVALINK_PROXY:}"

plugins:
  youtube:
    enabled: true
    pot:
      token: "Iggt6C3pRBLZeg=="
      visitorData: ""
    region: "ID"
    language: "id"
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - WEBEMBEDDED
      - ANDROID_TESTSUITE
      - ANDROID_VR
      - TV
    oauth:
      enabled: true
      refreshToken: "1//0gI39PyfQXSH0CgYIARAAGBASNwF-L9IrK-MlU7wH-eS1rw2--uNdYZ_9PElppS9q3g63OQVcFfYk7rAgZXXeSZtjmmcXtQy3oFY"
      skipValidation: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
