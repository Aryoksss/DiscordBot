server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.3"
  server:
    password: "${LAVALINK_PASS}"
    sources:
      youtube: false # Using plugin instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters: # Enabling all filters
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    # ratelimit:
    #   ipBlocks: ["2400:6180:0:d2:0:2:dad3:f000/124"]
    #   strategy: "RotateOnBan"
    #   searchTriggersFail: true
    #   retryLimit: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TVHTML5EMBEDDED
      - ANDROID_TESTSUITE
      - WEB
    oauth:
      enabled: true
      refreshToken: "1//0gL9P_cj-C8uRCgYIARAAGBASNwF-L9Ir5orBep3kN0_gFhp6jEmCwrEDE-d5DqlhiKF9Hc3vmjhIuRNg7QVBCM_sbSXsiqPhpec"
      skipValidation: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
